name: SYNC-DEBUG

on:
  push:
    paths:
      - '.gitea/workflows/sync-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Install pandas/openpyxl
        run: pip install pandas openpyxl --quiet

      - name: Debug sync LOTMIX
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          API="https://gitea.totipicks.com/api/v1"
          OWNER="edgar26"
          REPO="CLAUDE-LOTMIX"

          echo "=== TEST TOKEN ==="
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${API}/repos/${OWNER}/${REPO}")
          echo "HTTP=$HTTP"

          echo ""
          echo "=== TAMAÑOS XLSX EN APEX6 ==="
          ls -lh data/histories/*.xlsx 2>/dev/null

          echo ""
          echo "=== DESCARGANDO DE LOTMIX ==="
          for FNAME in "Anguilla history.xlsx" "La Primera History.xlsx" "La nacional history.xlsx"; do
            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('data/histories/${FNAME}', safe='/'))")
            URL="${API}/repos/${OWNER}/${REPO}/raw/${ENCODED}"
            OUT="/tmp/${FNAME// /_}.xlsx"
            HTTP=$(curl -s -w "%{http_code}" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -o "$OUT" "$URL")
            SIZE=$(wc -c < "$OUT" 2>/dev/null || echo 0)
            echo "  '${FNAME}': HTTP=$HTTP size=${SIZE}B"
          done

          echo ""
          echo "=== MERGE PYTHON ==="
          python3 - <<'PYEOF'
import os, sys
sys.path.insert(0, "src")
import pandas as pd
from io_xlsx import upsert_history_xlsx, ensure_dir

jobs = [
    ("/tmp/Anguilla_history.xlsx",    "data/histories/Anguilla history.xlsx"),
    ("/tmp/La_Primera_History.xlsx",  "data/histories/La Primera History.xlsx"),
    ("/tmp/La_nacional_history.xlsx", "data/histories/La nacional history.xlsx"),
]

for src_path, dst_path in jobs:
    fname = os.path.basename(dst_path)
    if not os.path.exists(src_path) or os.path.getsize(src_path) < 1000:
        print(f"[SKIP] {fname}: no descargado ({os.path.getsize(src_path) if os.path.exists(src_path) else 'no existe'}B)")
        continue
    try:
        df_src = pd.read_excel(src_path, dtype=str)
        df_src.columns = [c.strip().lower() for c in df_src.columns]
        print(f"\n[LOTMIX] {fname}: {len(df_src)} filas")
        if "sorteo" in df_src.columns:
            for s, n in df_src.groupby("sorteo").size().items():
                print(f"  {s}: {n}")

        if os.path.exists(dst_path):
            df_dst = pd.read_excel(dst_path, dtype=str)
            df_dst.columns = [c.strip().lower() for c in df_dst.columns]
            print(f"[APEX6] {fname}: {len(df_dst)} filas")
            if "sorteo" in df_dst.columns:
                for s, n in df_dst.groupby("sorteo").size().items():
                    print(f"  {s}: {n}")

        before = len(pd.read_excel(dst_path, dtype=str)) if os.path.exists(dst_path) else 0
        upsert_history_xlsx(dst_path, df_src)
        after = len(pd.read_excel(dst_path, dtype=str))
        print(f"[OK] {fname}: {before} → {after} (+{after-before})")
    except Exception as e:
        import traceback
        print(f"[ERROR] {fname}: {e}")
        traceback.print_exc()
PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.local"
          git add data/histories/*.xlsx || true
          git diff --cached --quiet || git commit -m "fix: sync XLSX desde LOTMIX via debug [skip ci]"
          git push || true
