name: APEX6

on:
  push:
    paths-ignore:
      - '**'
  schedule:
    - cron: "30 14 * * *"
    - cron: "15 16 * * *"
    - cron: "15 17 * * *"
    - cron: "45 18 * * *"
    - cron: "15 22 * * *"
    - cron: "20 1 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Forzar notificación Telegram (FORCE_NOTIFY=1)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            pip install --timeout 60 -r requirements.txt && break
            echo "pip install falló, reintentando en 10s..."
            sleep 10
          done

      - name: Sync historiales desde CLAUDE-LOTMIX
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          API="https://gitea.totipicks.com/api/v1"
          OWNER="edgar26"
          REPO="CLAUDE-LOTMIX"
          DST="data/histories"
          mkdir -p "$DST"

          download_xlsx() {
            local remote_path="$1"
            local local_path="$2"
            local encoded_path
            encoded_path=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$remote_path', safe=''))")
            local url="${API}/repos/${OWNER}/${REPO}/raw/${encoded_path}?token=${GITEA_TOKEN}"
            echo "[INFO] Descargando ${remote_path}..."
            HTTP_CODE=$(curl -s -w "%{http_code}" -o "${local_path}.tmp" "$url")
            if [ "$HTTP_CODE" = "200" ]; then
              mv "${local_path}.tmp" "${local_path}.lotmix"
              echo "[OK] Descargado: $(basename $remote_path)"
            else
              rm -f "${local_path}.tmp"
              echo "[WARN] No se pudo descargar ${remote_path} (HTTP $HTTP_CODE)"
            fi
          }

          download_xlsx "data/histories/Anguilla history.xlsx"    "$DST/Anguilla history.xlsx"
          download_xlsx "data/histories/La Primera History.xlsx"  "$DST/La Primera History.xlsx"
          download_xlsx "data/histories/La nacional history.xlsx" "$DST/La nacional history.xlsx"

          python3 - <<'PYEOF'
          import os, sys
          sys.path.insert(0, "src")
          import pandas as pd
          from io_xlsx import upsert_history_xlsx, ensure_dir

          dst = "data/histories"
          ensure_dir(dst)

          files = [
              "Anguilla history.xlsx",
              "La Primera History.xlsx",
              "La nacional history.xlsx",
          ]

          for name in files:
              src_path = os.path.join(dst, name + ".lotmix")
              dst_path = os.path.join(dst, name)
              if not os.path.exists(src_path):
                  print(f"[SKIP] Sin datos de LOTMIX para: {name}")
                  continue
              try:
                  df_src = pd.read_excel(src_path, dtype=str)
                  df_src.columns = [c.strip().lower() for c in df_src.columns]
                  if not {"fecha","sorteo","primero","segundo","tercero"}.issubset(df_src.columns):
                      print(f"[WARN] Columnas inesperadas en {name}: {list(df_src.columns)}")
                      os.remove(src_path)
                      continue
                  rows_before = len(pd.read_excel(dst_path, dtype=str)) if os.path.exists(dst_path) else 0
                  upsert_history_xlsx(dst_path, df_src)
                  rows_after = len(pd.read_excel(dst_path, dtype=str))
                  added = rows_after - rows_before
                  print(f"[OK] {name}: {rows_before} → {rows_after} filas (+{added} de LOTMIX)")
                  os.remove(src_path)
              except Exception as e:
                  print(f"[ERROR] Merge {name}: {e}")
                  try: os.remove(src_path)
                  except: pass
          PYEOF

      - name: Run APEX6
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || '0' }}
        run: python src/runner_apex6.py

      - name: Commit updated data
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.local"
          git add data/histories/*.xlsx data/state.json data/picks_log.csv outputs/ || true
          git diff --cached --quiet || git commit -m "chore: update histories & picks [skip ci]"
          for i in 1 2 3 4 5; do git push --force && break || sleep 10; done
