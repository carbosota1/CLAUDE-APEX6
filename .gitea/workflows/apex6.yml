name: APEX6

on:
  push:
    paths-ignore:
      - '**'
  schedule:
    - cron: "30 14 * * *"
    - cron: "15 16 * * *"
    - cron: "15 17 * * *"
    - cron: "45 18 * * *"
    - cron: "15 22 * * *"
    - cron: "20 1 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Forzar notificación Telegram (FORCE_NOTIFY=1)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            pip install --timeout 60 -r requirements.txt && break
            echo "pip install falló, reintentando en 10s..."
            sleep 10
          done

      - name: Sync historiales desde CLAUDE-LOTMIX
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          API="https://gitea.totipicks.com/api/v1"
          OWNER="edgar26"
          REPO="CLAUDE-LOTMIX"
          DST="data/histories"
          mkdir -p "$DST"
          LOG="data/sync_status.txt"

          log() { echo "$1" | tee -a "$LOG"; }

          echo "=== Sync LOTMIX $(date -u) ===" > "$LOG"
          log "[ANTES] Anguilla: $(wc -c < 'data/histories/Anguilla history.xlsx' 2>/dev/null || echo 0)B"
          log "[ANTES] LaPrimera: $(wc -c < 'data/histories/La Primera History.xlsx' 2>/dev/null || echo 0)B"
          log "[ANTES] LaNacional: $(wc -c < 'data/histories/La nacional history.xlsx' 2>/dev/null || echo 0)B"
          log "[ANTES] LaSuerte: $(wc -c < 'data/histories/La suerte history.xlsx' 2>/dev/null || echo 0)B"

          # Test token
          HTTP_TEST=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${API}/repos/${OWNER}/${REPO}")
          log "[TOKEN] HTTP=$HTTP_TEST"
          if [ "$HTTP_TEST" != "200" ]; then
            log "[ERROR] Token no funciona. Abortando sync."
            exit 0
          fi

          download_xlsx() {
            local remote_path="$1"
            local out_path="$2"
            local fname=$(basename "$remote_path")
            local encoded
            encoded=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${remote_path}', safe='/'))")
            local url="${API}/repos/${OWNER}/${REPO}/raw/${encoded}"
            log "[URL] $url"
            local http_code
            http_code=$(curl -s -w "%{http_code}" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -o "${out_path}" "$url")
            local size=$(wc -c < "${out_path}" 2>/dev/null || echo 0)
            log "[DESCARGA] '${fname}': HTTP=$http_code size=${size}B"
            if [ "$http_code" != "200" ] || [ "$size" -lt 1000 ]; then
              rm -f "${out_path}"
              log "[WARN] Descarga fallida para ${fname}"
              return 1
            fi
            return 0
          }

          download_xlsx "data/histories/Anguilla history.xlsx"      "/tmp/anguilla.lotmix.xlsx"
          download_xlsx "data/histories/La Primera History.xlsx"    "/tmp/laprimera.lotmix.xlsx"
          download_xlsx "data/histories/La nacional history.xlsx"   "/tmp/lanacional.lotmix.xlsx"
          download_xlsx "data/histories/La suerte history.xlsx"     "/tmp/lasuerte.lotmix.xlsx"

          python3 -I - <<'PYEOF'
import os, sys, traceback
sys.path.insert(0, "src")
import pandas as pd
from io_xlsx import upsert_history_xlsx, ensure_dir, read_history_xlsx

LOG = "data/sync_status.txt"

def log(msg):
    print(msg)
    with open(LOG, "a") as f:
        f.write(msg + "\n")

dst_dir = "data/histories"

jobs = [
    ("/tmp/anguilla.lotmix.xlsx",   os.path.join(dst_dir, "Anguilla history.xlsx")),
    ("/tmp/laprimera.lotmix.xlsx",  os.path.join(dst_dir, "La Primera History.xlsx")),
    ("/tmp/lanacional.lotmix.xlsx", os.path.join(dst_dir, "La nacional history.xlsx")),
    ("/tmp/lasuerte.lotmix.xlsx",   os.path.join(dst_dir, "La suerte history.xlsx")),
]

for src_path, dst_path in jobs:
    fname = os.path.basename(dst_path)
    if not os.path.exists(src_path):
        log(f"[SKIP] {fname}: no descargado")
        continue
    try:
        # Leer LOTMIX respetando hoja 'history' si existe
        xls_src = pd.ExcelFile(src_path, engine="openpyxl")
        log(f"[INFO] {fname} hojas LOTMIX: {xls_src.sheet_names}")
        sheet = "history" if "history" in xls_src.sheet_names else xls_src.sheet_names[0]
        df_src = pd.read_excel(src_path, sheet_name=sheet, dtype=str, engine="openpyxl")
        df_src.columns = [c.strip().lower() for c in df_src.columns]
        log(f"[INFO] {fname} cols LOTMIX: {list(df_src.columns)[:8]}")

        needed = {"fecha","sorteo","primero","segundo","tercero"}
        missing = needed - set(df_src.columns)
        if missing:
            log(f"[WARN] {fname}: faltan cols {missing}")
            continue

        df_src = df_src[["fecha","sorteo","primero","segundo","tercero"]].fillna("")
        log(f"[INFO] {fname} LOTMIX filas totales: {len(df_src)}")

        # Estado actual APEX6
        df_old = read_history_xlsx(dst_path)
        log(f"[INFO] {fname} APEX6 filas antes: {len(df_old)}")
        by_old = df_old.groupby("sorteo").size().to_dict()
        by_src = df_src.groupby("sorteo").size().to_dict()
        for s in sorted(set(by_old) | set(by_src)):
            log(f"    {s}: APEX6={by_old.get(s,0)} LOTMIX={by_src.get(s,0)} diff=+{by_src.get(s,0)-by_old.get(s,0)}")

        upsert_history_xlsx(dst_path, df_src)

        df_after = read_history_xlsx(dst_path)
        added = len(df_after) - len(df_old)
        log(f"[OK] {fname}: {len(df_old)} -> {len(df_after)} filas (+{added})")

    except Exception as e:
        log(f"[ERROR] {fname}: {e}")
        traceback.print_exc()

log("[DONE] Sync completado")
PYEOF

          log "[DESPUÉS] Anguilla: $(wc -c < 'data/histories/Anguilla history.xlsx' 2>/dev/null || echo 0)B"
          log "[DESPUÉS] LaSuerte: $(wc -c < 'data/histories/La suerte history.xlsx' 2>/dev/null || echo 0)B"

      - name: Run APEX6
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || '0' }}
        run: python src/runner_apex6.py

      - name: Commit updated data
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.local"
          git add data/histories/*.xlsx data/state.json data/picks_log.csv data/sync_status.txt outputs/ || true
          git diff --cached --quiet || git commit -m "chore: update histories & picks [skip ci]"
          for i in 1 2 3 4 5; do git push --force && break || sleep 10; done
