name: APEX6

on:
  push:
    paths-ignore:
      - '**'
  schedule:
    - cron: "30 14 * * *"
    - cron: "15 16 * * *"
    - cron: "15 17 * * *"
    - cron: "45 18 * * *"
    - cron: "15 22 * * *"
    - cron: "20 1 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Forzar notificación Telegram (FORCE_NOTIFY=1)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            pip install --timeout 60 -r requirements.txt && break
            echo "pip install falló, reintentando en 10s..."
            sleep 10
          done

      - name: Sync historiales desde CLAUDE-LOTMIX
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -e
          LOTMIX_URL="https://${GITEA_TOKEN}@gitea.totipicks.com/edgar26/CLAUDE-LOTMIX.git"
          echo "[INFO] Clonando historiales de CLAUDE-LOTMIX..."
          git clone --depth 1 "$LOTMIX_URL" /tmp/lotmix 2>&1 | grep -v "Cloning into"

          HIST_SRC="/tmp/lotmix/data/histories"
          HIST_DST="data/histories"

          python3 - <<'PYEOF'
          import os, sys
          sys.path.insert(0, "src")
          import pandas as pd
          from io_xlsx import upsert_history_xlsx, ensure_dir

          src = "/tmp/lotmix/data/histories"
          dst = "data/histories"
          ensure_dir(dst)

          files = [
              ("Anguilla history.xlsx",    "Anguilla history.xlsx"),
              ("La Primera History.xlsx",  "La Primera History.xlsx"),
              ("La nacional history.xlsx", "La nacional history.xlsx"),
          ]

          for src_name, dst_name in files:
              src_path = os.path.join(src, src_name)
              dst_path = os.path.join(dst, dst_name)
              if not os.path.exists(src_path):
                  print(f"[WARN] No existe en LOTMIX: {src_name}")
                  continue
              try:
                  df_src = pd.read_excel(src_path, dtype=str)
                  df_src.columns = [c.strip().lower() for c in df_src.columns]
                  if not {"fecha","sorteo","primero","segundo","tercero"}.issubset(df_src.columns):
                      print(f"[WARN] Columnas inesperadas en {src_name}: {list(df_src.columns)}")
                      continue
                  rows_before = len(pd.read_excel(dst_path, dtype=str)) if os.path.exists(dst_path) else 0
                  upsert_history_xlsx(dst_path, df_src)
                  rows_after = len(pd.read_excel(dst_path, dtype=str))
                  added = rows_after - rows_before
                  print(f"[OK] {dst_name}: {rows_before} → {rows_after} filas (+{added} de LOTMIX)")
              except Exception as e:
                  print(f"[ERROR] Merge {src_name}: {e}")
          PYEOF

      - name: Run APEX6
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || '0' }}
        run: python src/runner_apex6.py

      - name: Commit updated data
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.local"
          git add data/histories/*.xlsx data/state.json data/picks_log.csv outputs/ || true
          git diff --cached --quiet || git commit -m "chore: update histories & picks [skip ci]"
          for i in 1 2 3 4 5; do git push --force && break || sleep 10; done
