name: APEX6

on:
  push:
    paths-ignore:
      - '**'
  schedule:
    - cron: "30 14 * * *"
    - cron: "15 16 * * *"
    - cron: "15 17 * * *"
    - cron: "45 18 * * *"
    - cron: "15 22 * * *"
    - cron: "20 1 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Forzar notificación Telegram (FORCE_NOTIFY=1)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            pip install --timeout 60 -r requirements.txt && break
            echo "pip install falló, reintentando en 10s..."
            sleep 10
          done

      - name: Sync historiales desde CLAUDE-LOTMIX
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          API="https://gitea.totipicks.com/api/v1"
          OWNER="edgar26"
          REPO="CLAUDE-LOTMIX"
          DST="data/histories"
          mkdir -p "$DST"

          echo "=== Sync LOTMIX → APEX6 ==="

          # Test token primero
          HTTP_TEST=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${API}/repos/${OWNER}/${REPO}")
          echo "[INFO] Token check → HTTP $HTTP_TEST"
          if [ "$HTTP_TEST" != "200" ]; then
            echo "[ERROR] Token inválido o repo no accesible. Abortando sync (el runner continuará sin sync)."
            exit 0
          fi

          download_xlsx() {
            local remote_path="$1"
            local out_path="$2"
            local fname=$(basename "$remote_path")
            local encoded
            encoded=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${remote_path}', safe='/'))")
            local url="${API}/repos/${OWNER}/${REPO}/raw/${encoded}"
            local http_code
            http_code=$(curl -s -w "%{http_code}" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -o "${out_path}" "$url")
            local size=$(wc -c < "${out_path}" 2>/dev/null || echo 0)
            echo "[INFO] Descarga '${fname}': HTTP=$http_code size=${size}B"
            if [ "$http_code" != "200" ] || [ "$size" -lt 1000 ]; then
              rm -f "${out_path}"
              echo "[WARN] Descarga fallida o archivo vacío para ${fname}"
              return 1
            fi
            return 0
          }

          download_xlsx "data/histories/Anguilla history.xlsx"    "/tmp/anguilla.lotmix.xlsx"
          download_xlsx "data/histories/La Primera History.xlsx"  "/tmp/laprimera.lotmix.xlsx"
          download_xlsx "data/histories/La nacional history.xlsx" "/tmp/lanacional.lotmix.xlsx"

          python3 - <<'PYEOF'
import os, sys
sys.path.insert(0, "src")
import pandas as pd
from io_xlsx import upsert_history_xlsx, ensure_dir

dst_dir = "data/histories"
ensure_dir(dst_dir)

jobs = [
    ("/tmp/anguilla.lotmix.xlsx",    os.path.join(dst_dir, "Anguilla history.xlsx")),
    ("/tmp/laprimera.lotmix.xlsx",   os.path.join(dst_dir, "La Primera History.xlsx")),
    ("/tmp/lanacional.lotmix.xlsx",  os.path.join(dst_dir, "La nacional history.xlsx")),
]

for src_path, dst_path in jobs:
    fname = os.path.basename(dst_path)
    if not os.path.exists(src_path):
        print(f"[SKIP] {fname}: no descargado")
        continue
    try:
        df_src = pd.read_excel(src_path, dtype=str)
        df_src.columns = [c.strip().lower() for c in df_src.columns]
        needed = {"fecha","sorteo","primero","segundo","tercero"}
        if not needed.issubset(df_src.columns):
            print(f"[WARN] {fname}: columnas inesperadas {list(df_src.columns)}")
            continue

        rows_before = 0
        if os.path.exists(dst_path):
            df_dst = pd.read_excel(dst_path, dtype=str)
            rows_before = len(df_dst)
            # Desglose por sorteo antes
            if "sorteo" in df_dst.columns:
                before_by = df_dst.groupby("sorteo").size().to_dict()
            else:
                before_by = {}
        else:
            before_by = {}

        # Desglose LOTMIX
        if "sorteo" in df_src.columns:
            lotmix_by = df_src.groupby("sorteo").size().to_dict()
            print(f"[INFO] {fname} — LOTMIX tiene {len(df_src)} filas:")
            for s, n in sorted(lotmix_by.items()):
                apex_n = before_by.get(s, 0)
                print(f"    {s}: LOTMIX={n} APEX6={apex_n} diff=+{n-apex_n}")

        upsert_history_xlsx(dst_path, df_src)

        df_after = pd.read_excel(dst_path, dtype=str)
        rows_after = len(df_after)
        added = rows_after - rows_before
        print(f"[OK] {fname}: {rows_before} → {rows_after} filas (+{added})")
        if added == 0:
            print(f"[INFO] Sin filas nuevas — APEX6 ya estaba actualizado")
    except Exception as e:
        import traceback
        print(f"[ERROR] {fname}: {e}")
        traceback.print_exc()
PYEOF

      - name: Run APEX6
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || '0' }}
        run: python src/runner_apex6.py

      - name: Commit updated data
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.local"
          git add data/histories/*.xlsx data/state.json data/picks_log.csv outputs/ || true
          git diff --cached --quiet || git commit -m "chore: update histories & picks [skip ci]"
          for i in 1 2 3 4 5; do git push --force && break || sleep 10; done
